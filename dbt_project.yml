name: 'cat_digital'
version: '1.0.0'
config-version: 2
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  cat_digital:
    +quote_columns: false
    seed_telemetry_readings:
      +column_types:
        reading_id: NUMBER(38,0)
        machine_id: NUMBER(38,0)
        reading_ts: TIMESTAMP_NTZ
        engine_hours: FLOAT
        fuel_rate_gph: FLOAT
        coolant_temp_c: FLOAT
        oil_pressure_psi: FLOAT
        payload_tons: FLOAT
        idle_flag: BOOLEAN
    seed_maintenance_events:
      +column_types:
        event_id: NUMBER(38,0)
        machine_id: NUMBER(38,0)
        event_ts: TIMESTAMP_NTZ
        downtime_hours: FLOAT
        cost_usd: NUMBER(12,2)
    seed_parts_orders:
      +column_types:
        order_id: NUMBER(38,0)
        machine_id: NUMBER(38,0)
        order_ts: TIMESTAMP_NTZ
        quantity: NUMBER(38,0)
        lead_time_days: NUMBER(38,0)
